[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ehls-protocol"
version = "0.2.1"
description = "EHLS protocol reference: machine identity, encrypted instruction segments, and packet authentication"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lorcan Geraghty"}]
dependencies = ["cryptography>=42", "pydantic>=2.6,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "build>=1", "httpx>=0.27,<1"]

[project.scripts]
ehls = "ehls.cli:main"

[project.urls]
Repository = "https://github.com/lorcan10/ehls-protocol"

[tool.setuptools.packages.find]
include = ["shared*", "gateway*", "ehls*"]

[tool.setuptools.package-data]
ehls = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
