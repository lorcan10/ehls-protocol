[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ehls-protocol"
version = "0.1.0"
description = "EHLS protocol reference: machine identity, encrypted instruction segments, and packet authentication"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lorcan Geraghty"}]
dependencies = ["cryptography>=42", "pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1"]

[project.urls]
Repository = "https://github.com/lorcan10/ehls-protocol"

[tool.setuptools.packages.find]
include = ["shared*", "gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
