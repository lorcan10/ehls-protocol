name: Protocol tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[api,dev]'
      - run: python -m pytest -q
      - run: python -m examples.local_stream --no-memory-lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sdk/javascript/client.test.js
  docker:
    runs-on: ubuntu-latest
    env:
      EHLS_API_TOKEN: ci-simulator-token-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ehls-protocol-ci .
      - run: docker run -d --name ehls-ci --ulimit memlock=8388608:8388608 -e EHLS_API_TOKEN -p 127.0.0.1:8765:8765 ehls-protocol-ci
      - run: python tools/smoke_test.py
      - if: always()
        run: docker logs ehls-ci
      - if: always()
        run: docker rm -f ehls-ci
