services:
  ehls:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      EHLS_API_TOKEN: ${EHLS_API_TOKEN:?Copy .env.example to .env and set EHLS_API_TOKEN}
      EHLS_MEMORY_LOCK: ${EHLS_MEMORY_LOCK:-1}
      EHLS_ALLOWED_ORIGINS: ${EHLS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    ulimits:
      memlock:
        soft: 8388608
        hard: 8388608
    init: true
